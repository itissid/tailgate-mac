name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-and-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out complete history without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check publication privacy, including complete history
        run: python3 Scripts/check-public.py
      - name: Exercise privacy scanner regressions
        run: python3 -B -m unittest discover -s Tests/Privacy -v
      - name: Require Swift 6.1 or later
        run: |
          swift --version
          python3 - <<'PY'
          import re, subprocess
          text = subprocess.check_output(['swift', '--version'], text=True)
          match = re.search(r'Swift version (\d+)\.(\d+)', text)
          if not match or tuple(map(int, match.groups())) < (6, 1):
              raise SystemExit('Swift 6.1+ is required; select a supported runner toolchain.')
          PY
      - name: Build release executables
        run: swift build -c release
      - name: Run offline Swift Testing suite
        run: swift test --disable-xctest
